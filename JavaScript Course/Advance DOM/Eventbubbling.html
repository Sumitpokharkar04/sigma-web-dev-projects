<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event bubbling</title>
    <style>
        .container{
            width: 300px;
            height: 300px;
            background-color: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .childcontainer{
            width: 200px;
            height: 200px;
            background-color: lightgreen;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .child{
            width: 100px;
            height: 100px;
            background-color: rgb(39, 193, 204);
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="childcontainer">
            <div class="child">
                I am pretty box
            </div>
        </div>
    </div>

    <script>

        document.querySelector(".container").addEventListener("click",(e)=>{
            e.stopPropagation()
            alert("Container clicked");
        });

        document.querySelector(".childcontainer").addEventListener("click",(e)=>{
            e.stopPropagation()
            alert("Child Container clicked");   
        });

        document.querySelector(".child").addEventListener("click",(e)=>{
            e.stopPropagation()
            alert("Child clicked");
        });

        setInterval(() => {
            document.querySelector(".child").style.backgroundColor = "rgb("+Math.floor(Math.random()*256)+","+Math.floor(Math.random()*256)+","+Math.floor(Math.random()*256)+")";
        }, 1000);

        let a = setTimeout(()=>{
            document.querySelector(".container").style.backgroundColor = "black";      
        }, 1000);   

        setTimeout(()=>{
            clearTimeout(a);      
        }, 3000);

    </script>
</body>
</html>

<!--as we can see when we click on child the other two divs that hold him thier
event listener also gets called to stop this we use stop propogation with the help of
event object-->
